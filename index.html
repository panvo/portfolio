<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JRB Portfolio" />
    <meta name="application-name" content="JRB Portfolio" />
    <!-- theme-color follows the active in-app theme; kept in sync by JS on toggle -->
    <meta name="theme-color" id="theme-color-meta" content="#0a0a0d" />

    <!-- set theme before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('portfolio-theme') || 'dark'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
          var m = document.getElementById('theme-color-meta')
          if (m) m.setAttribute('content', t === 'light' ? '#f5f4ef' : '#0a0a0d')
        } catch (e) {}
      })()
    </script>

    <title>Jhon Rey Bañaga — QA Engineer & Software Tester</title>
    <meta

      content="Jhon Rey Bañaga — Software Tester with 9+ years in manual, functional & database testing. Creator of TestOps Hub, an AI-native QA platform."
    />
