<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Jhon Rey Bañaga</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0a0d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { --bg:#0a0a0d; --text:rgba(255,255,255,.95); --muted:rgba(255,255,255,.6); --accent:#a05a2c; --accent2:#7e858f; --border:rgba(255,255,255,.14); }
      * { box-sizing:border-box; margin:0; }
      html,body { height:100%; }
      body {
        background:var(--bg); color:var(--text); font-family:'Space Grotesk',system-ui,sans-serif;
        display:grid; place-items:center; min-height:100vh; padding:24px; overflow:hidden; position:relative;
        -webkit-font-smoothing:antialiased;
      }
      .glow { position:fixed; inset:0; z-index:0; pointer-events:none;
        background:
          radial-gradient(48vw 48vw at 82% 8%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 66%),
          radial-gradient(42vw 42vw at 8% 100%, color-mix(in srgb, var(--accent2) 24%, transparent), transparent 66%);
        filter:blur(20px);
      }
      .wrap { position:relative; z-index:1; text-align:center; max-width:520px; }
      .mark { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; margin:0 auto 28px;
        background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 16px 40px -18px color-mix(in srgb,var(--accent) 60%, transparent); }
      .mark svg { width:26px; height:26px; }
      .code { font-size:clamp(88px,20vw,168px); font-weight:700; line-height:.9; letter-spacing:-.04em;
        background:linear-gradient(180deg,#fff, color-mix(in srgb,#fff 40%,transparent)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
      h1 { font-size:clamp(20px,4vw,26px); font-weight:600; letter-spacing:-.02em; margin-top:8px; }
      p { color:var(--muted); font-size:15px; line-height:1.6; margin:14px auto 0; max-width:400px; }
      .btn { display:inline-flex; align-items:center; gap:8px; margin-top:30px; padding:.85rem 1.5rem; border-radius:999px;
        background:#fff; color:var(--bg); font-weight:600; font-size:.94rem; text-decoration:none; transition:transform .25s ease, box-shadow .25s ease; }
      .btn:hover { transform:translateY(-2px); box-shadow:0 20px 44px -20px rgba(0,0,0,.7); }
      .foot { position:fixed; bottom:22px; left:0; right:0; text-align:center; z-index:1;
        font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,.4); }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="wrap">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none"><path d="M17 34l9.5 9.5L47 21.5" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="code">404</div>
      <h1>This page went off-script.</h1>
      <p>The link is broken or the page has moved. No failed assertion here — let's get you back on track.</p>
      <a class="btn" href="/">&larr;&nbsp; Back to portfolio</a>
    </div>
    <div class="foot">Jhon Rey Bañaga — QA Engineer &middot; Software Tester</div>
  </body>
</html>
